<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя страница</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #350e42, #4f0000);
      font-family: system-ui, sans-serif;
      color: #5a2a3a;
      padding: 40px 16px;
    }

    .page {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
      width: 100%;
      max-width: 640px;
    }

    .card {
      background: #fff5f7;
      border: 3px solid #821111;
      border-radius: 0;
      padding: 40px;
      text-align: center;
      width: 100%;
      box-shadow: 0 10px 30px rgba(214, 58, 90, 0.2);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.6s ease forwards;
    }

    .card:nth-child(2) {
      animation-delay: 0.15s;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin: 0 0 10px;
      color: #d63a5a;
      font-size: 2rem;
    }
    p {
      margin: 8px 0;
      line-height: 1.5;
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .games-title {
      margin: 0 0 16px;
      font-size: 1.3rem;
      color: #821111;
      font-weight: 700;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 18px;
    }
    .filters button {
      background: #fff5f7;
      border: 2px solid #821111;
      color: #821111;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 0;
    }
    .filters button.active,
    .filters button:hover {
      background: #821111;
      color: #fff5f7;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
