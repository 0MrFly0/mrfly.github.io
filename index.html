<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя страница</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #350e42, #4f0000);
      font-family: system-ui, sans-serif;
      color: #5a2a3a;
      padding: 40px 16px;
    }

    .card {
      background: #fff5f7;
      border: 3px solid #821111;
      border-radius: 0;
      padding: 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(214, 58, 90, 0.2);
    }

    h1 {
      margin: 0 0 10px;
      color: #d63a5a;
      font-size: 2rem;
    }

    p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    /* ===== блок игр ===== */
    .games-title {
      margin: 30px 0 16px;
      font-size: 1.3rem;
      color: #821111;
      font-weight: 700;
      border-top: 2px solid #821111;
      padding-top: 20px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 2px solid #821111;
      border-radius: 0;
    }

    .game .name {
      margin-top: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #5a2a3a;
      line-height: 1.2;
    }

    .game .score {
      margin-top: 3px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #d63a5a;
    }

    @media (max-width: 420px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img 
      src="square-image.jpg" 
      alt="аватар"
      style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid #4f0000; object-fit: cover; margin-bottom: 15px;"
    >
    <div class="emoji">💻</div>
    <h1>MrFly</h1>
    <p>17yo Male</p>
    <p>Всё по-немногу</p>

    <!-- блок игр -->
    <div class="games-title">Favorite Games</div>
    <div class="games-grid">

      <div class="game">
        <img src="SPecteDestruction.webp" alt="forsaken">
        <div class="name">Forsaken</div>
        <div class="score">8 / 10</div>
      </div>

      <div class="game">
        <img src="square-image (1).jpg" alt="goi">
        <div class="name">Getting Over It with Bennett Foddy</div>
        <div class="score">9 / 10</div>
      </div>

      <div class="game">
        <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/252950/library_600x900_2x.jpg" alt="Rocket League">
        <div class="name">Rocket League</div>
        <div class="score">8.5 / 10</div>
      </div>

      <div class="game">
        <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/1172470/library_600x900_2x.jpg" alt="Apex">
        <div class="name">Apex Legends</div>
        <div class="score">8.0 / 10</div>
      </div>

      <div class="game">
        <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/578080/library_600x900_2x.jpg" alt="PUBG">
        <div class="name">PUBG</div>
        <div class="score">7.5 / 10</div>
      </div>

      <div class="game">
        <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/271590/library_600x900_2x.jpg" alt="GTA V">
        <div class="name">GTA V</div>
        <div class="score">9.0 / 10</div>
      </div>

    </div>
  </div>
</body>
</html>
