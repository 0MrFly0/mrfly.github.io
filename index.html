<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrFly — Моя страница</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: linear-gradient(135deg, #350e42, #4f0000);
      font-family: system-ui, sans-serif;
      color: #5a2a3a;
      padding: 40px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* ===== FLOATING PARTICLES ===== */
    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;          /* ниже модалки (100) и интро (9999) */
      pointer-events: none; /* не мешают кликам */
    }

    /* ===== INTRO OVERLAY ===== */
    #intro-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 5, 15, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.7s ease, backdrop-filter 0.7s ease;
    }

    #intro-overlay.hidden {
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(0);
    }

    .click-text {
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 800;
      color: #fff5f7;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      text-shadow: 0 0 40px rgba(214, 58, 90, 0.6);
      animation: pulse 2s ease-in-out infinite;
      user-select: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    /* ===== LAYOUT ===== */
    .page-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: minmax(260px, 0.85fr) minmax(0, 1.5fr);
      gap: 24px;
      align-items: start;
      position: relative;
      z-index: 2; /* выше частиц */
    }

    .card {
      background: #fff5f7;
      border: 3px solid #821111;
      border-radius: 0;
      padding: 32px;
      text-align: center;
      min-width: 0;
      width: 100%;
      box-shadow: 0 10px 30px rgba(214, 58, 90, 0.2);
      opacity: 0;
      transform: translateY(24px);
      animation: cardAppear 0.8s cubic-bezier(.2, .75, .25, 1) forwards;
    }

    .profile-card { animation-delay: 0.1s; }
    .games-card  { animation-delay: 0.25s; }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0 0 10px;
      color: #d63a5a;
      font-size: 2rem;
    }

    p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .avatar {
      width: 200px;
      height: 200px;
      max-width: 100%;
      border-radius: 50%;
      border: 3px solid #4f0000;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .games-title {
      margin: 0 0 20px;
      font-size: 1.5rem;
      color: #821111;
      font-weight: 700;
    }

    /* ===== MUSIC PLAYER (внутри профиля) ===== */
    .music-player {
      width: 100%;
      max-width: 260px;
      margin: 28px auto 0;
      background: #fff0f3;
      border: 3px solid #821111;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .player-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(145deg, #821111, #4f0000);
      border: 2px solid #821111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      color: #fff5f7;
      position: relative;
      overflow: hidden;
    }

    .player-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent 60%);
    }

    .track-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #5a2a3a;
      line-height: 1.3;
    }

    .player-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: #e8c8d0;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #d63a5a;
      transition: width 0.1s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #821111;
      font-weight: 600;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      background: #821111;
      border: none;
      color: #fff5f7;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px auto 0;
      transition: background 0.2s, transform 0.15s;
    }

    .play-btn:hover {
      background: #d63a5a;
      transform: scale(1.05);
    }

    .play-btn:active {
      transform: scale(0.96);
    }

    .player-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ===== FILTERS & GAMES ===== */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .filters button {
      background: #fff5f7;
      border: 2px solid #821111;
      color: #821111;
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.2s, color 0.2s;
    }

    .filters button.active,
    .filters button:hover {
      background: #821111;
      color: #fff5f7;
    }

    .filters button:focus-visible,
    .game:focus-visible,
    .close-btn:focus-visible,
    .play-btn:focus-visible {
      outline: 3px solid #d63a5a;
      outline-offset: 3px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px 14px;
    }

    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .game:hover {
      transform: translateY(-4px);
    }

    .game.hidden {
      display: none;
    }

    .game img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 2px solid #821111;
      border-radius: 0;
    }

    .game .name {
      margin-top: 7px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #5a2a3a;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .game .score {
      margin-top: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #d63a5a;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }

    .modal {
      background: #fff5f7;
      border: 3px solid #821111;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
      animation: modalAppear 0.25s ease;
    }

    @keyframes modalAppear {
      from { transform: translateY(12px); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }

    .modal img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border: 2px solid #821111;
      margin-bottom: 12px;
    }

    .modal h2 {
      margin: 0 25px 8px;
      color: #d63a5a;
      font-size: 1.3rem;
      overflow-wrap: anywhere;
    }

    .modal-score {
      font-size: 1.1rem;
      font-weight: 700;
      color: #821111;
      margin-bottom: 12px;
    }

    .modal-review {
      font-size: 0.95rem;
      color: #5a2a3a;
      line-height: 1.7;
      text-align: left;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: #821111;
      cursor: pointer;
      line-height: 1;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 760px) {
      body { padding: 20px 12px; }
      .page-layout {
        grid-template-columns: 1fr;
        max-width: 560px;
        gap: 18px;
      }
      .card { padding: 24px 18px; }
    }

    @media (max-width: 420px) {
      .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .filters button {
        font-size: 0.8rem;
        padding: 6px 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
      .card { opacity: 1; transform: none; }
      .click-text { animation: none; }
    }
  </style>
</head>

Она умело маскируется под rage game и по большей части она и являлась бы просто стримерским слопом с корявым управлением и сделанным на коленке, если бы не её философия.

Бэннет Фоди и не скрывал, что хотел страдания игроков, он буквально сказал об этом в трейлере. Однако его отношение к страданию видно довольно явно. Он заставляет нас страдать не для садистских желаний, а для того чтобы мы научились преодолевать гнев и разочарование.

Главное, что преподносит эта игра: «Падение в самый низ не означает крах, это просто возвращение назад с новыми знаниями», и после этого становится понятно, зачем нужно такое корявое управление.

Как я понял физику этой игры (а я прошёл её два раза): чем больше ты делаешь быстрых и резких движений, тем хуже твой персонаж что-либо делает. Но если делать всё плавно и аккуратно, а желательно ещё и медленно, то прыжки и устойчивость будут намного выше.

То есть игра учит к тому же и терпению, так как после того как ты падаешь вниз, ты с большей вероятностью будешь пытаться пройти этап быстрее, торопливо, что приведёт тебя к падению ещё ниже.

Но это к сожалению исключительно моя вина, так как поиграл в эту игру слишком поздно, уже посмотрев контент по ней много раз.

Но вообще это одна из немногих игр, которая и сложная и не душная, и определённо войдёт в мой топ игр. Наверное потому что в большинстве игр сложность либо искусственная, либо там присутствует какой-то элемент рандома. В этой же игре ты не можешь винить не себя, здесь нет случайностей, всё хорошо вымерено.

Как по мне это уникальность, штучный продукт, а остальные игры данного семейства, по типу Boxman Struggle, я не вижу смысла проходить, так как они просто не поведают ничего нового.

  <script>
    // ===== FLOATING PARTICLES =====
    (function initParticles() {
      const canvas = document.getElementById('particles-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      // Цвета из градиента фона + акцентные
      const COLORS = [
        'rgba(53, 14, 66, 0.85)',   // #350e42
        'rgba(79, 0, 0, 0.85)',     // #4f0000
        'rgba(130, 17, 17, 0.75)',  // #821111
        'rgba(214, 58, 90, 0.65)',  // #d63a5a
        'rgba(90, 42, 58, 0.7)'     // #5a2a3a
      ];

      let particles = [];
      let animationId = null;
      let width = 0;
      let height = 0;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }

      function createParticle() {
        const size = Math.random() * 4 + 1.5; // 1.5–5.5 px
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          size: size,
          baseSize: size,
          speedX: (Math.random() - 0.5) * 0.35,
          speedY: (Math.random() - 0.5) * 0.35 - 0.15, // лёгкий уход вверх
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          opacity: Math.random() * 0.5 + 0.35,
          pulse: Math.random() * Math.PI * 2,
          pulseSpeed: 0.01 + Math.random() * 0.02
        };
      }

      function init() {
        resize();
        const count = Math.min(70, Math.floor((width * height) / 18000)); // адаптивно
        particles = Array.from({ length: count }, createParticle);
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        for (const p of particles) {
          // пульсация размера и яркости
          p.pulse += p.pulseSpeed;
          const scale = 1 + Math.sin(p.pulse) * 0.25;
          const currentSize = p.baseSize * scale;
          const alpha = p.opacity * (0.75 + Math.sin(p.pulse) * 0.25);

          // один сплошной шарик (без оболочки)
          ctx.beginPath();
          ctx.arc(p.x, p.y, currentSize, 0, Math.PI * 2);
          ctx.fillStyle = p.color.replace(/[\d.]+\)$/, alpha + ')');
          ctx.fill();

          // движение
          p.x += p.speedX;
          p.y += p.speedY;

          // выход за край → телепорт с другой стороны
          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;
          if (p.y < -10) p.y = height + 10;
          if (p.y > height + 10) p.y = -10;
        }

        animationId = requestAnimationFrame(draw);
      }

      // уважение prefers-reduced-motion
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!prefersReduced) {
        init();
        draw();
        window.addEventListener('resize', () => {
          init();
        });
      }
    })();

    // ===== INTRO + АВТОЗАПУСК МУЗЫКИ =====
    const overlay = document.getElementById('intro-overlay');
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    let isPlaying = false;

    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      
      audio.play().then(() => {
        isPlaying = true;
        playBtn.textContent = '❚❚';
      }).catch(err => {
        console.log('Автозапуск заблокирован:', err);
      });
    });

    // ===== КАСТОМНЫЙ ПЛЕЕР =====
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = percent + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      isPlaying = false;
      playBtn.textContent = '▶';
      progressBar.style.width = '0%';
    });

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶';
      } else {
        audio.play();
        playBtn.textContent = '❚❚';
      }
      isPlaying = !isPlaying;
    });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      audio.currentTime = percent * audio.duration;
    });

    // ===== ФИЛЬТРЫ ИГР =====
    const buttons = document.querySelectorAll('.filters button');
    const games = document.querySelectorAll('.game');

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        buttons.forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        const filter = button.dataset.filter;
        games.forEach(game => {
          const score = game.dataset.score;
          const show = filter === 'all' || score === filter;
          game.classList.toggle('hidden', !show);
        });
      });
    });

    // ===== МОДАЛКА РЕЦЕНЗИЙ =====
    const modal = document.getElementById('modal');
    const closeBtn = document.getElementById('closeModal');
    const modalImg = document.getElementById('modalImg');
    const modalName = document.getElementById('modalName');
    const modalScore = document.getElementById('modalScore');
    const modalReview = document.getElementById('modalReview');
    let previousFocus = null;

    function openReview(game) {
      previousFocus = document.activeElement;
      const img = game.querySelector('img');
      const name = game.querySelector('.name');
      const score = game.querySelector('.score');
      modalImg.src = img.src;
      modalImg.alt = img.alt;
      modalName.textContent = name.textContent;
      modalScore.textContent = score.textContent;
      modalReview.textContent = game.dataset.review || 'Отзыв пока не написан.';
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }

    function closeReview() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      if (previousFocus) previousFocus.focus();
    }

    games.forEach(game => {
      game.addEventListener('click', () => openReview(game));
      game.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openReview(game);
        }
      });
    });

    closeBtn.addEventListener('click', closeReview);
    modal.addEventListener('click', e => {
      if (e.target === modal) closeReview();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeReview();
    });
  </script>

</body>
</html>
