<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя страница</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e8d5f5, #ffd6e6);
      font-family: system-ui, sans-serif;
      color: #5a2a3a;
    }
    .card {
      background: #fff5f7;
      border: 3px solid #d63a5a;
      border-radius: 0;          /* ← острые углы */
      padding: 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(214, 58, 90, 0.2);
    }
    h1 {
      margin: 0 0 10px;
      color: #d63a5a;
      font-size: 2rem;
    }
    p {
      margin: 8px 0;
      line-height: 1.5;
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">♡</div>
    <h1>Привет, я Имя</h1>
    <p>Мне 16 лет</p>
    <p>Люблю музыку, аниме и делать штуки</p>
    <p>:3</p>
  </div>
</body>
</html>
