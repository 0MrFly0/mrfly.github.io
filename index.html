<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя страница</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #350e42, #4f0000);
      font-family: system-ui, sans-serif;
      color: #5a2a3a;
      padding: 40px 16px;
    }
    .card {
      background: #fff5f7;
      border: 3px solid #821111;
      border-radius: 0;
      padding: 40px;
      text-align: center;
      max-width: 640px;   /* ← шире */
      width: 100%;
      box-shadow: 0 10px 30px rgba(214, 58, 90, 0.2);
    }
    h1 {
      margin: 0 0 10px;
      color: #d63a5a;
      font-size: 2rem;
    }
    p {
      margin: 8px 0;
      line-height: 1.5;
    }
    .emoji {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    /* ===== блок игр ===== */
    .games-title {
      margin: 30px 0 16px;
      font-size: 1.3rem;
      color: #821111;
      font-weight: 700;
      border-top: 2px solid #821111;
      padding-top: 20px;
    }

    /* кнопки фильтра */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 18px;
    }
    .filters button {
      background: #fff5f7;
      border: 2px solid #821111;
      color: #821111;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 0;
    }
    .filters button.active,
    .filters button:hover {
      background: #821111;
      color: #fff5f7;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .game:hover {
      transform: scale(1.05);
    }
    .game.hidden {
      display: none;
    }
    .game img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 2px solid #821111;
      border-radius: 0;
    }
    .game .name {
      margin-top: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #5a2a3a;
      line-height: 1.2;
    }
    .game .score {
      margin-top: 3px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #d63a5a;
    }

    /* ===== модальное окно ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal {
      background: #fff5f7;
      border: 3px solid #821111;
      border-radius: 0;
      padding: 28px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      position: relative;
      max-height: 80vh;      /* не выше 80% экрана */
      overflow-y: auto;      /* прокрутка внутри */
    }
    .modal img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border: 2px solid #821111;
      margin-bottom: 12px;
    }
    .modal h2 {
      margin: 0 0 8px;
      color: #d63a5a;
      font-size: 1.3rem;
    }
    .modal .modal-score {
      font-size: 1.1rem;
      font-weight: 700;
      color: #821111;
      margin-bottom: 12px;
    }
    .modal .modal-review {
      font-size: 0.95rem;
      color: #5a2a3a;
      line-height: 1.5;
    }
    .modal .close-btn {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #821111;
      cursor: pointer;
      line-height: 1;
    }

    @media (max-width: 420px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <img 
      src="square-image.jpg" 
      alt="аватар"
      style="width: 200px; height: 200px; border-radius: 50%; border: 3px solid #4f0000; object-fit: cover; margin-bottom: 15px;"
    >
    <div class="emoji">💻</div>
    <h1>MrFly</h1>
    <p>17yo Male</p>
    <p>Всё по-немногу</p>

    <div class="games-title">Games</div>

    <!-- кнопки фильтра -->
    <div class="filters">
      <button class="active" data-filter="all">Все</button>
      <button data-filter="говно">Говницо💑</button>
      <button data-filter="таксебе">Пойдет😐</button>
      <button data-filter="норм">Нормально👍</button>
      <button data-filter="гуд">Хорошечно👏</button>
      <button data-filter="эс">Идеально🌟</button>
    </div>

    <div class="games-grid" id="gamesGrid">

      <div class="game" data-score="гуд" data-review="Крутой хоррор, атмосфера огонь, иногда бесит лагами.">
        <img src="SPecteDestruction.webp" alt="Forsaken">
        <div class="name">Forsaken</div>
        <div class="score">8 / 10</div>
      </div>

      <div class="game" data-score="эс" data-review="Игра,которая в своё время заставила всех стримеров и летсплейщиков ломать свои девайсы. Она умело маскируется под rage game и по большей части она и являлась бы просто стримерским слопом с корявым управлением и сделанным на коленке, если бы не её философия. Многие вероятно подметили её, как просто троллинг над игроком, говоря цитаты о значении проигрыша, включая расслабляющую музыку, намёк на Сизифа, но вместо валуна молот. Однако на самом деле философия этой игры довольно хорошая и искренняя. Бэннет Фоди и не скрывал, что хотел страдания игроков, он буквально сказал об этом в трейлере. Однако его отношение к страданию видно довольно явно. Он заставляет нас страдать не для садистских желаний, а для того чтобы мы научились преодолевать гнев и разочарование. Главное, что
преподносит эта игра: ‘Падение в самый низ не означает крах, это просто возвращение назад с новыми знаниями’, и после этого становится понятно, зачем нужно такое корявое управление. Как я понял физику этой игры (а я прошел её два раза): чем больше ты делаешь быстрых и резких движений, тем хуже твой персонаж что-либо делает. Но если делать все плавно и аккуратно, а желательно еще и медленно, то прыжки и устойчивость будут намного выше. То есть игра учит к тому же и терпению, так как после того как ты падаешь вниз, ты с большей вероятностью будешь пытаться пройти этап быстрее, торопливо, что приведёт тебя к падению ещё ниже.
Но для меня эта идея создателя разбилась в ♥♥♥♥♥. Я прошёл игру слишком быстро в первый раз, упав всего пару раз и я даже не успел ‘насладиться’ сильной фрустрацией, и это меня реально разочаровывает. Но это к сожалению исключительно моя вина, так как поиграл в эту игру слишком поздно, уже посмотрев контент по ней много раз.
Но вообще это одна из немногих игр, которая и сложная и не душная, и определённо войдет в мой топ игр. Наверное потому что в большинстве игр сложность либо искусственная, либо там присутствует какой-то элемент рандома. В этой же игре ты не можешь винить не себя, здесь нет случайностей, всё хорошо вымерено. Как по мне это уникальность, штучный продукт, а остальные игры данного семейства, по типу boxman struggle я не вижу смысла проходить, так как они просто не поведают ничего нового.
Ну и музыка в титрах отличная, заела в голове.">
        <img src="square-image (1).jpg" alt="Getting Over It">
        <div class="name">Getting Over It with Bennett Foddy</div>
        <div class="score">10 / 10</div>
      </div>

      <div class="game" data-score="гуд" data-review="Затягивает на сотни часов. Рандомайз топ.">
        <img src="OBFoC2B2fAdbdKR9iPCJcDQaSKylLmhw.avif" alt="TBOI">
        <div class="name">The Binding Of Isaac: Rebirth</div>
        <div class="score">8 / 10</div>
      </div>

      <div class="game" data-score="норм" data-review="Красиво и сложно, но иногда слишком жестко.">
        <img src="cuhead.png" alt="Cuphead">
        <div class="name">Cuphead</div>
        <div class="score">6 / 10</div>
      </div>

      <div class="game" data-score="гуд" data-review="Атмосфера и мир — огонь. Боссы местами бесят.">
        <img src="Hollow_Knight_2026_cover_art.jpg" alt="Hollow Knight">
        <div class="name">Hollow Knight</div>
        <div class="score">7 / 10</div>
      </div>

      <div class="game" data-score="норм" data-review="Обычный опенворлд с так себе сюжетом и персонажами, ну и скамом гоев на деньги через онлайн версию. От неё хотябы глаза не выкалывает, как от Сан Андреса">
        <img src="https://cdn.cloudflare.steamstatic.com/steam/apps/271590/library_600x900_2x.jpg" alt="GTA V">
        <div class="name">GTA V</div>
        <div class="score">5 / 10</div>
      </div>

    </div>
  </div>

  <!-- модальное окно -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="close-btn" id="closeModal">&times;</button>
      <img id="modalImg" src="" alt="">
      <h2 id="modalName"></h2>
      <div class="modal-score" id="modalScore"></div>
      <div class="modal-review" id="modalReview"></div>
    </div>
  </div>

  <script>
    // --- фильтр ---
    const buttons = document.querySelectorAll('.filters button');
    const games = document.querySelectorAll('.game');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const filter = btn.dataset.filter;

        games.forEach(game => {
          const score = game.dataset.score;
          let show = false;
          
          if (filter === 'all') show = true;
          else show = score === filter;

          game.classList.toggle('hidden', !show);
        });
      });
    });

    // --- модалка ---
    const modal = document.getElementById('modal');
    const closeBtn = document.getElementById('closeModal');

    games.forEach(game => {
      game.addEventListener('click', () => {
        document.getElementById('modalImg').src = game.querySelector('img').src;
        document.getElementById('modalName').textContent = game.querySelector('.name').textContent;
        document.getElementById('modalScore').textContent = game.querySelector('.score').textContent;
        document.getElementById('modalReview').textContent = game.dataset.review || 'Отзыв пока не написан.';
        modal.classList.add('open');
      });
    });

    closeBtn.addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', e => {
      if (e.target === modal) modal.classList.remove('open');
    });
  </script>
</body>
</html>
