<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MrFly — Моя страница</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: linear-gradient(135deg, #350e42, #4f0000);
      font-family: system-ui, sans-serif;
      color: #5a2a3a;
      padding: 40px 16px;
    }

    /* ===== INTRO OVERLAY ===== */
    #intro-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 5, 15, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.7s ease, backdrop-filter 0.7s ease;
    }

    #intro-overlay.hidden {
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(0);
    }

    .click-text {
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 800;
      color: #fff5f7;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      text-shadow: 0 0 40px rgba(214, 58, 90, 0.6);
      animation: pulse 2s ease-in-out infinite;
      user-select: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    /* ===== LAYOUT ===== */
    .page-layout {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: minmax(260px, 0.85fr) minmax(0, 1.5fr);
      gap: 24px;
      align-items: start;
    }

    .card {
      background: #fff5f7;
      border: 3px solid #821111;
      border-radius: 0;
      padding: 32px;
      text-align: center;
      min-width: 0;
      width: 100%;
      box-shadow: 0 10px 30px rgba(214, 58, 90, 0.2);
      opacity: 0;
      transform: translateY(24px);
      animation: cardAppear 0.8s cubic-bezier(.2, .75, .25, 1) forwards;
    }

    .profile-card { animation-delay: 0.1s; }
    .games-card  { animation-delay: 0.25s; }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0 0 10px;
      color: #d63a5a;
      font-size: 2rem;
    }

    p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .avatar {
      width: 200px;
      height: 200px;
      max-width: 100%;
      border-radius: 50%;
      border: 3px solid #4f0000;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .games-title {
      margin: 0 0 20px;
      font-size: 1.5rem;
      color: #821111;
      font-weight: 700;
    }

    /* ===== MUSIC PLAYER (внутри профиля) ===== */
    .music-player {
      width: 100%;
      max-width: 260px;
      margin: 28px auto 0;
      background: #fff0f3;
      border: 3px solid #821111;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .player-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(145deg, #821111, #4f0000);
      border: 2px solid #821111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      color: #fff5f7;
      position: relative;
      overflow: hidden;
    }

    .player-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent 60%);
    }

    .track-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #5a2a3a;
      line-height: 1.3;
    }

    .player-controls {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: #e8c8d0;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #d63a5a;
      transition: width 0.1s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #821111;
      font-weight: 600;
    }
